<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GvG</title>
<style>
/* ====== COULEURS & STYLE : modifiables ici ====== */
:root{--bg:#14161c;--c:#252a36;--t:#e7e9ee;--m:#8b90a0;--a:#9a9aff;--g:#2a2f3b;--ok:#22c55e;--ko:#ef4444}
[data-theme=light]{--bg:#f4f5f8;--c:#e3e6ee;--t:#1b1e27;--m:#5d6475;--a:#4545d6;--g:#d3d8e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
#app{max-width:1250px;margin:0 auto;padding:20px}a{color:var(--a);text-decoration:none}h1{font-size:30px;margin:6px 0 18px}h2{margin:30px 0 12px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.chip{background:var(--c);padding:9px 16px;border-radius:20px;color:var(--t);display:inline-flex;gap:8px;align-items:center;border:0;font:inherit;cursor:pointer}
.chip.on{outline:1px solid var(--a);color:var(--a)}.chip i{width:11px;height:11px;border-radius:50%;background:var(--m)}.V i{background:var(--ok)}.D i{background:var(--ko)}
.badge{border:1px solid var(--ok);color:var(--ok);border-radius:20px;padding:4px 14px}.badge.D{border-color:var(--ko);color:var(--ko)}
.sub{color:var(--m);margin:4px 0}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}
th{background:var(--c);text-align:right;padding:6px 10px;white-space:nowrap}td{padding:5px 10px;text-align:right;border:1px solid var(--bg);white-space:nowrap}
th:first-child,td:first-child{text-align:left}td.n{color:#0b1020}.dim{color:var(--m)}
svg text{fill:var(--m);font-size:10px}.pl .chip{padding:3px 10px;font-size:12px}h3{margin:18px 0 8px}
.fr{display:flex;position:relative;margin:26px 0 14px}.fr:before{content:"";position:absolute;left:4%;right:4%;top:calc(1.3em + 12px);height:2px;background:var(--g)}
.fr a{flex:1;text-align:center;color:var(--t);position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.fr span{line-height:1.3em}
.fr i{width:14px;height:14px;border-radius:50%;background:var(--a);border:2px solid var(--bg)}.fr .V i{background:var(--ok)}.fr .D i{background:var(--ko)}.fr small{color:var(--m);padding:0 4px}
.rp{background:var(--c);border-radius:12px;padding:16px 20px;max-width:900px}.rt{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}.big{font-size:34px;font-weight:700}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%}
.rr{display:grid;grid-template-columns:1fr 70px 1.2fr 70px 1fr;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--g)}.rr span{text-align:center;color:var(--m)}
.rr .b{display:flex;height:6px}.rr .b.l{justify-content:flex-end}.rr .b i{display:block;height:100%;border-radius:3px}.rr b:first-of-type{text-align:right}
.ic{width:34px;height:34px;border-radius:50%;margin:1px;vertical-align:middle;object-fit:cover}.ic.sm{width:28px;height:28px}.ic.big{width:50px;height:50px}.ic.mow{border-radius:8px}.dt th{text-align:center}.dt td{text-align:center}.dt td.l,.dt td:first-child{text-align:left}
.clk{cursor:pointer}.clk:hover td{filter:brightness(1.12)}.bl{columns:2;margin:0;padding-left:16px;text-align:left;min-width:170px}
.pill{border-radius:12px;padding:2px 10px;font-size:12px;border:1px solid;white-space:nowrap}.pill.ko{color:var(--ko)}.pill.ok{color:var(--ok)}.pill.nt{color:var(--m)}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20}#modal[hidden]{display:none}
.mb{background:var(--bg);border:1px solid var(--g);border-radius:12px;padding:18px;max-width:min(96vw,760px);max-height:92vh;overflow:auto;position:relative}.x{position:absolute;top:8px;right:8px;padding:2px 10px}
.mp{position:relative;width:min(80vw,640px);aspect-ratio:1;margin-top:10px}.mp .bg{width:100%;height:100%;object-fit:cover;border-radius:8px}.pu{position:absolute;transform:translate(-50%,-50%)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:16px}.mcard{background:var(--c);border-radius:12px;padding:12px}.dl{display:flex;gap:10px;align-items:center;padding:3px 0;flex-wrap:wrap}.dl .sub{margin-left:auto}
.mc{background:var(--c);border-radius:10px;padding:8px;cursor:pointer;text-align:center}.mc.on,.ut.on{outline:2px solid var(--a)}.mc img{width:100%;height:90px;object-fit:cover;border-radius:6px}
.ut{display:inline-flex;flex-direction:column;align-items:center;width:78px;margin:4px;cursor:pointer;border-radius:8px;padding:4px;text-align:center}.ut small{font-size:10px;color:var(--m)}.ut .ic{width:44px;height:44px}
.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.nav h1{margin-right:10px};background:var(--bg);border-radius:10px;padding:1px 7px;margin:1px;font-size:11px}td.l{text-align:left;white-space:normal}#th{position:fixed;top:12px;right:14px;z-index:5}
</style></head><body><button id="th" class="chip">☀/☾</button><div id="app"></div>
<script src="data/bundle.js"></script>
<script>
/* ====== TEXTES & COULEURS DES GRAPHIQUES : modifiables ici ====== */
const CFG={nous:'#d79a10',adv:'#9e0e40',barre:'#22c55e',
 t:{home:'Classement général',moy:'Moyenne',sc:'Scores',fi:'Fiabilité',det:'Détails',chr:'Chronologie',km:'Jetons théoriquement réussis',adv:'Adversaires',nous:'Notre guilde',de:'Défense',perfo:'Performance offensive',perfoSaisons:'Performance offensive au fil des saisons',def:'Performance défensive',det2:'Détail des performances offensives',rapport:'Rapport de guerre'},
 bf5Depuis:28, // à partir de cette saison : BF5 (avant : BF4)
 // abréviation affichée pour chaque buff de zone (à adapter si besoin)
 buffs:{EnvDefenderHealthBuff2:'MS',EnvFlakFire:'AA',EnvArmourSupplies:'AR',EnvArtillerySupport:'AP',EnvAngelsOfDeath:'LP',EnvFortified:'FP'},
 // abréviation de chaque bâtiment (type de zone du JSON)
 bat:{MedicaeStation1:'MS1',MedicaeStation2:'MS2',HQ:'HQ',SupplyDepot:'SD',LandingPad1:'LP1',LandingPad2:'LP2',Armoury:'AR',ArtilleryPosition1:'AP1',ArtilleryPosition2:'AP2',AntiAirBattery:'AA',Bunker1:'FP1',Bunker2:'FP2',Trenches1:'FL gauche',Trenches2:'FL milieu',Trenches3:'FL droite'}};
const D=window.GDG,$=document.getElementById('app');
const N=id=>D.noms[id]||id,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,r_=Math.round;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seasons=[...new Set(D.wars.map(w=>w.saison))].sort((a,b)=>a-b);
const warsOf=s=>D.wars.filter(w=>w.saison==s).sort((a,b)=>a.war-b.war);
const W=id=>D.wars.find(w=>w.war_id==id);
const P={};D.players.forEach(p=>(P[p.war_id]??={})[p.user_id]=p);
const bf=s=>s>=CFG.bf5Depuis?'BF5':'BF4';
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const frise=it=>`<div class="fr">${it.map(i=>`<a href="${i.href}" class="${i.c||''}"><span>${i.top}</span><i></i><small>${i.bot}</small></a>`).join('')}</div>`;
const hm=t=>'+'+Math.floor(t)+'h'+String(r_(t%1*60)).padStart(2,'0');
const cls=w=>/^v/i.test(w.resultat||'')?'V':/^d/i.test(w.resultat||'')?'D':'';
const VIR=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]]; // dégradé viridis (bas -> haut)
const bg=(v,lo,hi)=>{if(v==null)return'';const t=hi>lo?(v-lo)/(hi-lo):1,p=t*4,i=Math.min(3,Math.floor(p)),f=p-i,c=VIR[i].map((x,k)=>r_(x+(VIR[i+1][k]-x)*f));return`style="background:rgb(${c});color:${t<.55?'#fff':'#0b1020'}"`};
// thème clair / sombre
const setT=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}};
let th;try{th=localStorage.getItem('th')}catch(e){}
setT(th||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
document.getElementById('th').onclick=()=>setT(document.documentElement.dataset.theme=='light'?'dark':'light');

function heat(rows,cols){
 const M=rows.map(r=>cols.map(c=>c.get(r.id))),av=M.map(m=>avg(m.filter(v=>v!=null)));
 const all=M.flat().concat(av).filter(v=>v!=null),lo=Math.min(...all),hi=Math.max(...all);
 return`<div class="scroll"><table><tr><th>Joueur</th>${cols.map(c=>`<th>${c.href?`<a href="${c.href}">${esc(c.label)}</a>`:esc(c.label)}</th>`).join('')}<th>${CFG.t.moy}</th></tr>`+
 rows.map((r,i)=>`<tr><td>${esc(r.label)}</td>${M[i].map(v=>`<td class="n" ${bg(v,lo,hi)}>${v==null?'<span class=dim>-</span>':r_(v)}</td>`).join('')}<td class="n" ${bg(av[i],lo,hi)}>${av[i]==null?'-':r_(av[i])}</td></tr>`).join('')+'</table></div>';
}
function bars(items,mx=Math.max(...items.map(i=>i.v),1),fmt=r_){
 const w=items.length*28+50;
 return`<div class="scroll"><svg width="${w}" height="270" viewBox="0 0 ${w} 270">`+items.map((it,i)=>{const h=it.v/mx*180,x=20+i*28;
 return`<rect x="${x}" y="${210-h}" width="20" height="${h}" rx="2" fill="${CFG.barre}"/><text x="${x+10}" y="${205-h}" text-anchor="middle">${fmt(it.v)}</text><text transform="translate(${x+12},218) rotate(55)">${esc(it.label)}</text>`}).join('')+'</svg></div>';
}
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,i=Math.floor(p);return s[i]+(s[Math.min(i+1,s.length-1)]-s[i])*(p-i)};
// joueurs actuels = participants de la dernière guerre
const lastW=[...D.wars].sort((a,b)=>a.saison-b.saison||a.war-b.war).at(-1);
const ACTIFS=new Set(Object.values(P[lastW.war_id]||{}).filter(p=>p.participe).map(p=>p.user_id));
let ONLY=false;try{ONLY=localStorage.getItem('only')=='1'}catch(e){}
const keep=id=>!ONLY||ACTIFS.has(id);
const onlyBtn=()=>`<div class="chips"><button class="chip${ONLY?' on':''}" id="onlyb">Joueurs actuels uniquement</button></div>`;
const bindOnly=()=>{document.getElementById('onlyb').onclick=()=>{ONLY=!ONLY;try{localStorage.setItem('only',ONLY?'1':'0')}catch(e){};render()}};
const battles=ids=>ids.flatMap(id=>D.details[id].batailles.filter(b=>b.equipe=='nous'&&keep(b.user_id)));
function boxes(B){ // médiane et quartiles des scores individuels par bataille
 const by={};B.forEach(b=>(by[b.user_id]??=[]).push(b.score_jeu??0));
 const it=Object.entries(by).map(([id,a])=>({l:N(id),q:[0,.25,.5,.75,1].map(q=>quant(a,q))})).sort((a,b)=>b.q[2]-a.q[2]||b.q[1]-a.q[1]);
 const w=it.length*28+60,Y=v=>230-v/1600*200;
 let g=`<div class="scroll"><svg width="${w}" height="330" viewBox="0 0 ${w} 330">`;
 for(let v=0;v<=1600;v+=400)g+=`<line x1="40" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--g)"/><text x="34" y="${Y(v)+3}" text-anchor="end">${v}</text>`;
 it.forEach((o,i)=>{const x=50+i*28,[a,b,c,d,e]=o.q.map(Y);
  g+=`<line x1="${x+10}" x2="${x+10}" y1="${a}" y2="${e}" stroke="var(--m)"/><rect x="${x}" y="${d}" width="20" height="${Math.max(b-d,1)}" rx="3" fill="${CFG.barre}" fill-opacity=".25" stroke="${CFG.barre}"/><line x1="${x}" x2="${x+20}" y1="${c}" y2="${c}" stroke="${CFG.barre}" stroke-width="3"/><text transform="translate(${x+12},242) rotate(55)">${esc(o.l)}</text>`});
 return g+'</svg></div><div class="sub">Médiane et quartiles (25 %–75 %) des scores individuels par bataille ; moustaches = min / max.</div>';
}
function fiab(B){ // % de victoires (oneshot, cleanup ou IA) par jeton
 const by={};B.forEach(b=>{const o=by[b.user_id]??={n:0,s:0};o.n++;o.s+=b.succes?1:0});
 return bars(Object.entries(by).map(([id,o])=>({label:N(id),v:100*o.s/o.n})).sort((a,b)=>b.v-a.v),100,v=>r_(v)+'%')+'<div class="sub">Probabilité de victoire par jeton utilisé (oneshot, cleanup ou combat contre IA).</div>';
}
function setTabs(defs){const tb=document.getElementById('tb'),tc=document.getElementById('tc');
 const show=i=>{[...tb.children].forEach((b,j)=>b.classList.toggle('on',i==j));tc.innerHTML=defs[i].f()};
 tb.innerHTML=defs.map((d,i)=>`<button class="chip" data-i="${i}">${d.l}</button>`).join('');tb.onclick=e=>e.target.dataset.i&&show(+e.target.dataset.i);show(0)}
const tabsHtml='<div class="chips" id="tb"></div><div id="tc"></div>';

function sumTable(ws){const K=['tot','atk','map','buff','med2','med1','unu','suc','os0','os1','os2','os34','cln','ia','fail'],acc={};
 ws.forEach(w=>Object.values(P[w.war_id]||{}).forEach(p=>{if(!keep(p.user_id))return;const o=acc[p.user_id]??={joueur:N(p.user_id),np:0};if(p.participe)o.np++;K.forEach(k=>o[k]=(o[k]||0)+p[k])}));
 const rows=Object.values(acc).filter(o=>o.np>0).sort((a,b)=>b.tot-a.tot||b.suc-a.suc);rows.forEach((o,i)=>o.rang=i+1);return tbl(rows)}
function home(){
 const V={};D.players.filter(p=>p.participe&&keep(p.user_id)).forEach(p=>((V[p.user_id]??={})[p.saison]??=[]).push(p.tot));
 const sv=(id,s)=>V[id]?.[s]?avg(V[id][s]):null;
 const rows=Object.keys(V).map(id=>({id,label:N(id),o:avg(seasons.map(s=>sv(id,s)).filter(v=>v!=null))})).sort((a,b)=>b.o-a.o);
 $.innerHTML=`<div class="nav"><h1>${CFG.t.home}</h1><a class="chip" href="#/prep">Préparation défense de guerre</a><a class="chip" href="#/strat">Stratégie d'attaque</a></div>${frise(seasons.map(s=>({href:'#/s/'+s,top:'Saison '+s,bot:bf(s)})))}${onlyBtn()}${methode()}<h2>${CFG.t.perfo}</h2>${tabsHtml}<h2>${CFG.t.perfoSaisons}</h2>`+
 heat(rows,seasons.map(s=>({label:'Saison '+s,href:'#/s/'+s,get:id=>sv(id,s)}))) +`<h2>${CFG.t.def}</h2><div id="dfh"></div>`;
 bindOnly();const WI=D.wars.map(w=>w.war_id),B=battles(WI);
 setTabs([{l:CFG.t.moy,f:()=>bars(rows.map(r=>({label:r.label,v:r.o})))},{l:CFG.t.sc,f:()=>boxes(B)},{l:CFG.t.fi,f:()=>fiab(B)}]);
 document.getElementById('dfh').innerHTML=defense(WI,true);
}
function season(s){
 const ws=warsOf(s),get=w=>id=>{const p=P[w.war_id]?.[id];return p&&p.participe?p.tot:null};
 const ids=[...new Set(ws.flatMap(w=>Object.values(P[w.war_id]||{}).filter(p=>p.participe&&keep(p.user_id)).map(p=>p.user_id)))];
 const rows=ids.map(id=>({id,label:N(id),o:avg(ws.map(w=>get(w)(id)).filter(v=>v!=null))})).sort((a,b)=>b.o-a.o);
 $.innerHTML=`<a href="#/">← ${CFG.t.home}</a><h1>Saison ${s} <span class="sub">${bf(s)}</span></h1>${frise(ws.map(w=>({href:'#/w/'+w.war_id,top:w.war,bot:esc(w.guilde_adverse),c:cls(w)})))}${onlyBtn()}<h2>${CFG.t.perfo}</h2>${tabsHtml}<h2>Performance offensive au fil de la saison ${s}</h2>`+
 heat(rows,ws.map(w=>({label:w.guilde_adverse,href:'#/w/'+w.war_id,get:get(w)}))) +`<h2>${CFG.t.det2}</h2>${sumTable(ws)}<h2>${CFG.t.def}</h2><div id="dfh"></div>`;
 bindOnly();const WI=ws.map(w=>w.war_id),B=battles(WI);
 setTabs([{l:CFG.t.moy,f:()=>bars(rows.map(r=>({label:r.label,v:r.o})))},{l:CFG.t.sc,f:()=>boxes(B)},{l:CFG.t.fi,f:()=>fiab(B)}]);
 document.getElementById('dfh').innerHTML=defense(WI,true);
}
const COLS=[['rang','Rang'],['tot','Tot'],['atk','Att'],['map','Carte'],['buff','Bonus'],['med2','2med'],['med1','1med'],['unu','Inu'],['suc','Suc'],['os0','16'],['os1','14'],['os2','12'],['os34','11'],['cln','Achv'],['ia','IA'],['fail','Échec']];
function tbl(ps){const v=ps.map(p=>p.tot),mx=Math.max(...v),mn=Math.min(...v);
 return`<div class="scroll"><table><tr><th>Joueur</th>${COLS.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${ps.map(p=>`<tr><td>${esc(p.joueur)}</td>${COLS.map(([k])=>k=='tot'?`<td class="n" ${bg(p.tot,mn,mx)}>${p.tot}</td>`:`<td>${p[k]}</td>`).join('')}</tr>`).join('')}</table></div>`}
function chrono(b,ev){
 const T=Math.max(...b.map(x=>x.t_h),1),w=1100,X=t=>40+t/T*(w-60),col={nous:CFG.nous,adverse:CFG.adv};
 const cum={nous:[[0,0]],adverse:[[0,0]]},tot={nous:0,adverse:0};
 b.forEach(x=>{tot[x.equipe]+=x.score_brut||0;cum[x.equipe].push([x.t_h,tot[x.equipe]])});
 const mx=Math.max(tot.nous,tot.adverse,1),Y=v=>170-v/mx*150;
 const line=(a,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${a.concat([[T,a.at(-1)[1]]]).map(([t,v])=>X(t)+','+Y(v)).join(' ')}"/>`;
 let g=`<svg width="${w}" height="240" viewBox="0 0 ${w} 240">`;
 const raw=mx/5,pw=10**Math.floor(Math.log10(raw)),st=[1,2,5,10].map(m=>m*pw).find(q=>q>=raw);
 for(let v=0;v<=mx;v+=st)g+=`<line x1="40" x2="${w-20}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--g)"/><text x="34" y="${Y(v)+3}" text-anchor="end">${r_(v/1000)}k</text>`;
 for(let t=0;t<=T;t+=6)g+=`<line x1="${X(t)}" x2="${X(t)}" y1="10" y2="175" stroke="var(--g)"/><text x="${X(t)}" y="190" text-anchor="middle">+${t}h</text>`;
 g+=line(cum.nous,col.nous)+line(cum.adverse,col.adverse);
 b.filter(x=>x.categorie=='echec').forEach(x=>{const y=x.equipe=='nous'?198:212;g+=`<line x1="${X(x.t_h)}" x2="${X(x.t_h)}" y1="${y}" y2="${y+11}" stroke="${col[x.equipe]}"/>`});
 const zd=ev.filter(e=>e.type=='zoneDestroyed'&&e.t_h>=0);
 zd.forEach(e=>g+=`<circle cx="${X(e.t_h)}" cy="${Y((cum[e.equipe].filter(p=>p[0]<=e.t_h).at(-1)||[0,0])[1])}" r="3" fill="${col[e.equipe]}" stroke="var(--t)"/>`);
 ['nous','adverse'].forEach((t,i)=>{const z=zd.filter(e=>e.equipe==t).sort((a,b)=>a.t_h-b.t_h)[14];if(z)
  g+=`<line x1="${X(z.t_h)}" x2="${X(z.t_h)}" y1="10" y2="175" stroke="${col[t]}" stroke-dasharray="5 4"/><text x="${X(z.t_h)-4}" y="${20+i*12}" text-anchor="end" style="fill:${col[t]}">Extermination ${hm(z.t_h)}</text>`});
 return g+`</svg><div class="sub">Score cumulé par équipe · points = zones détruites · pointillés = 15ᵉ bâtiment détruit · traits = jetons perdus.</div>`;
}
function km(b,nN,nA,tk){ // jetons théoriquement réussis (type Kaplan-Meier)
 const w=1100,h=280,xm=Math.max(nN,nA)*tk,seq={};
 [['nous',nN,CFG.nous],['adverse',nA,CFG.adv]].forEach(([t,n,c])=>{const T=n*tk;let f=0,k=0;const pts=[[0,100]];
  b.filter(x=>x.equipe==t).forEach(x=>{k++;if(x.categorie=='echec'){f++;pts.push([k-1,pts.at(-1)[1]]);pts.push([k,100*(T-f)/T])}});pts.push([k,pts.at(-1)[1]]);seq[t]={pts,c,T}});
 const lo=Math.floor(Math.min(...Object.values(seq).map(s=>s.pts.at(-1)[1]))/10)*10,X=v=>40+v/xm*(w-60),Y=v=>20+(100-v)/(100-lo)*220;
 let g=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
 for(let v=lo;v<=100;v+=10)g+=`<line x1="40" x2="${w-20}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--g)"/><text x="34" y="${Y(v)+3}" text-anchor="end">${v}%</text>`;
 for(let v=0;v<=xm;v+=50)g+=`<text x="${X(v)}" y="258" text-anchor="middle">${v}</text>`;
 Object.entries(seq).forEach(([t,s])=>g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`);
 return g+`<text x="${w/2}" y="274" text-anchor="middle">Jetons utilisés (départ : ${nN*tk} nous / ${nA*tk} adversaire)</text></svg>`;
}
function methode(){const tk=D.wars[0]?.n_tokens||10;

 const R=Object.values(G).filter(o=>o.ok>0).sort((a,b)=>a.tier-b.tier||(b.ok+1)/(b.n+2)-(a.ok+1)/(a.n+2)||b.n-a.n).slice(0,40),t=v=>v?'<b style="color:var(--ok)">✔</b>':'<b style="color:var(--ko)">✘</b>',
  sub=o=>o.ident||!o.miss.length?'':`<div style="white-space:nowrap">${o.miss.map((m,i)=>ic(m,'ic sm')+' → '+(o.extra[i]?ic(o.extra[i],'ic sm'):'?')).join(' · ')}</div>`;
 document.getElementById('s3').innerHTML=R.length?`<div class="sub">Victoires = oneshots (score ≥ 1100) ; les coups de grâce sont exclus. Substitution = unité sélectionnée → unité réellement vue en défense.</div><div class="scroll"><table class="dt"><tr><th>Attaque</th><th>% succès</th><th>Score moyen</th><th>Apparitions</th><th>Défense identique</th><th>Carte identique</th></tr>${R.map(o=>`<tr><td class="l">${team(o.comp,o.mow,'ic')}</td><td>${r_(100*o.ok/o.n)} %</td><td>${r_(o.sc/o.n)}</td><td>${o.n}</td><td>${t(o.ident)}${sub(o)}</td><td>${t(o.same)}</td></tr>`).join('')}</table></div>`:'<div class="sub">Aucune attaque victorieuse connue : choisis une carte et/ou une défense.</div>'}
function strat(){const ids=[...new Set(D.players.filter(p=>p.participe).map(p=>p.user_id))].sort((a,b)=>N(a).localeCompare(N(b)));
 $.innerHTML=`<a href="#/">← ${CFG.t.home}</a><h1>Stratégie d'attaque</h1><h2>1. Sélection de la carte</h2><div id="s1"></div><h2>2. Sélection de la défense</h2><div id="s2"></div>
 <h2>Choix du joueur <span class="sub">(optionnel)</span></h2><select onchange="ST.player=this.value||null"><option value="">Tous les joueurs</option>${ids.map(id=>`<option value="${esc(id)}"${ST.player==id?' selected':''}>${esc(N(id))}</option>`).join('')}</select><div class="sub">Restreint l'analyse aux attaques de ce joueur.</div>
 <h2>3. Attaques fiables</h2><button class="chip" onclick="stGo()">Lancer la recherche</button><div id="s3" style="margin-top:12px"></div>`;st1();st2()}
function war(id){
 const w=W(id),d=D.details[id],ps=Object.values(P[id]||{}).sort((a,b)=>a.rang-b.rang),adv=[...(d.adversaires||[])].sort((a,b)=>a.rang-b.rang);
 $.innerHTML=`<a href="#/s/${w.saison}">← Saison ${w.saison}</a><h1>${esc(w.guilde_adverse)}</h1>
 <div class="sub">${w.start_iso.slice(0,10)} · Bonification MAP : 2 pts ${w.map_2pts.join(', ')} · 1 pt ${w.map_1pts.join(', ')}</div>
 <h2>${CFG.t.rapport}</h2>${rapport(w,d,ps.length,adv.length||ps.length)}
 <h2>${CFG.t.chr}</h2><div class="scroll">${chrono(d.batailles,d.evenements)}</div>
 <h2>${CFG.t.km}</h2><div class="scroll">${km(d.batailles,ps.length,adv.length||ps.length,w.n_tokens)}</div>
 <div class="sub">Part des jetons théoriquement réussis : le départ est 100 % ; chaque échec fait descendre la courbe.</div>
 <h2>${esc(w.guilde)}</h2>${tbl(ps)}<h2>${esc(w.guilde_adverse)}</h2>${tbl(adv)}
 <h2>Défense</h2><h3>${esc(w.guilde)}</h3>${defWar(w,d,'nous')}<h3>${esc(w.guilde_adverse)}</h3>${defWar(w,d,'adverse')}
 <h2>Efficacité de la défense</h2>${defense([id])}`;
}
function render(){const [,k,a]=location.hash.split('/');window.scrollTo(0,0);
 try{k=='s'?season(a):k=='w'?war(a):k=='prep'?prep():k=='strat'?strat():home()}catch(e){$.innerHTML='<pre>'+esc(e.stack)+'</pre>'}}
addEventListener('hashchange',render);render();
